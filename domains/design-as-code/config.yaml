version: 9
domain: design-as-code
rules:
  markdown: {required_heading: h1, frontmatter: {human_revised: {}, summary: {}}}
  index_md: {frontmatter: {targets: {}}}
  pillar_index: {frontmatter: {targets: {}, summary: {}}}
root:
  framework: true
  frontmatter: {depends-on: {optional: true}}
  domain.md: {framework: true, tags: [components, root]}
  disciplines: {framework: true, "*.md": {framework: true}}
  roles: {framework: true, "*.md": {framework: true}}
  templates:
    framework: true
    handoff.md: {framework: true, tags: [touched]}
    spec.md: {framework: true, tags: [reference]}
    "*.md": {framework: true}
  intake:
    framework: true
    "*.md": {frontmatter: {key: {}, type: {}, tracker: {}, status: {}, synced-at: {}, targets: {}, relates: {optional: true}}}
  research:
    framework: true
    "*": {optional: true, frontmatter: {type: {}, status: {}, summary: {}, targets: {}, source: {optional: true}, audience: {optional: true}, relates: {optional: true}}}
  plans:
    framework: true
    "*":
      frontmatter: {scope: {}, status: {}, summary: {}, targets: {}, key: {optional: true}, type: {optional: true}, audience: {optional: true}, platforms: {optional: true}, aux: {optional: true}}
      "t*.md": {frontmatter: {plan: {}, task: {}, depends-on: {}, concerns: {}, files: {}, status: {}, targets: {}, aux: {}}}
      "handoff-t*.md": {frontmatter: {plan: {}, task: {}, status: {}, date: {}}, tags: [touched]}
      delta-draft.md: {optional: true, frontmatter: {plan: {}, status: {}, date: {}}}
  specs:
    framework: true
    "*": {frontmatter: {name: {}, summary: {}, depends-on: {}, relates: {optional: true}, targets: {}}, "*.md": {frontmatter: {name: {}, summary: {}, depends-on: {}, relates: {optional: true}, targets: {}}}}
  assets: {framework: true, "*.md": {frontmatter: {type: {}, status: {}, summary: {}, targets: {}, source: {optional: true}, license: {optional: true}, relates: {optional: true}}}}
  concepts: {framework: true, "*": {optional: true, frontmatter: {status: {}, summary: {}, targets: {}, audience: {optional: true}, research: {optional: true}, relates: {optional: true}}}}
meta: {targets: {values: [platform, meta]}, specification_dir: specs, coverage: {source: []}}
