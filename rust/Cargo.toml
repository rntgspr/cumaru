[package]
name = "cumaru"
version = "0.10.2"
edition = "2024"
license = "MIT"

[dependencies]
candle-core = { version = "=0.9.1", default-features = false }
candle-nn = { version = "=0.9.1", default-features = false }
candle-transformers = { version = "=0.9.1", default-features = false }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
glob = "0.3.3"
clap = { version = "4.6.7", features = ["derive"] }
jsonschema = { version = "0.58.3", default-features = false }
serde_json = "1.0.151"
yaml-rust2 = "0.13.0"
