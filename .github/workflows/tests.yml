name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Native Rust on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Verify formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Run native unit tests
        run: cargo test --manifest-path rust/Cargo.toml --locked

      - name: Build release binary
        run: bash rust/build.sh

      - name: Smoke release binary
        run: |
          expected="cumaru $(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n 1)"
          actual="$(./rust/target/release/cumaru --version)"
          test "$actual" = "$expected" || { echo "expected $expected, got $actual"; exit 1; }
          ./rust/target/release/cumaru help >/dev/null
