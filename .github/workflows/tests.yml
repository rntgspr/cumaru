name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Native Rust on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Select stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Verify universal domain mirrors
        run: scripts/sync-domain-kernel.sh --check

      - name: Verify formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Run native unit tests
        run: cargo test --manifest-path rust/Cargo.toml --locked

      - name: Build release binary
        run: bash rust/build.sh

      - name: Prepare pinned ShellSpec process harness
        run: |
          curl -fsSL https://github.com/shellspec/shellspec/archive/refs/tags/0.28.1.tar.gz -o "$RUNNER_TEMP/shellspec.tar.gz"
          echo "400d835466429a5fe6c77a62775a9173729d61dd43e05dfa893e8cf6cb511783  $RUNNER_TEMP/shellspec.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/shellspec"
          tar -xzf "$RUNNER_TEMP/shellspec.tar.gz" -C "$RUNNER_TEMP/shellspec" --strip-components=1
          echo "$RUNNER_TEMP/shellspec/bin" >> "$GITHUB_PATH"

      - name: Run native CLI regressions
        run: |
          bash tests/run.sh --ci
          bash tests/run.sh --random

      - name: Smoke release binary
        run: |
          expected="cumaru $(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n 1)"
          actual="$(./rust/target/release/cumaru --version)"
          test "$actual" = "$expected" || { echo "expected $expected, got $actual"; exit 1; }
          ./rust/target/release/cumaru help >/dev/null
