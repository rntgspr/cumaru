name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing numeric release tag to build
        required: true
        type: string

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_VERSION }}
      - name: Prepare toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add "$TARGET"
          if [[ "$TARGET" == *linux-musl ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
            echo 'RUSTFLAGS=-C linker=musl-gcc' >> "$GITHUB_ENV"
            echo 'CC=musl-gcc' >> "$GITHUB_ENV"
            if [[ "$TARGET" == aarch64-* ]]; then
              # gemm-f16's ARM assembly requires FP16 instruction support.
              echo 'RUSTFLAGS=-C linker=musl-gcc -C target-feature=+fp16' >> "$GITHUB_ENV"
            fi
          fi
      - name: Validate release and source
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n 1)"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_VERSION" = "$version"
          scripts/sync-domain-kernel.sh --check
          cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Test and build target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --manifest-path rust/Cargo.toml --target "$TARGET" --locked
          cargo build --manifest-path rust/Cargo.toml --target "$TARGET" --release --locked
      - name: Smoke and package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="rust/target/$TARGET/release/cumaru"
          test "$("$binary" --version)" = "cumaru $RELEASE_VERSION"
          "$binary" help >/dev/null
          if [[ "$TARGET" == *linux-musl ]]; then
            readelf -l "$binary" > /tmp/cumaru-program-headers
            ! grep -q INTERP /tmp/cumaru-program-headers
          fi
          mkdir -p dist
          cp "$binary" "dist/cumaru-$TARGET"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cumaru-${{ matrix.target }}
          path: dist/cumaru-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          test "$(find . -type f | wc -l)" -eq 4
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            test -s "cumaru-$target"
          done
          sha256sum cumaru-* > SHA256SUMS
          gh release create "$RELEASE_VERSION" cumaru-* SHA256SUMS --verify-tag --draft --title "Cumaru $RELEASE_VERSION" --generate-notes
          gh release edit "$RELEASE_VERSION" --draft=false --latest
